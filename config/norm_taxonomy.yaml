# Norm-violation search-term taxonomy.
#
# Derived 2026-06-02 from a synthesis of the academic norm literature (see
# docs/norm_taxonomy_research.md for the full process + citations). Each
# top-level key is a NORM CATEGORY; `frameworks` records which theories/datasets
# motivate it (Moral Foundations Theory, Schwartz values, Brown & Levinson
# politeness, Hall proxemics, Turiel social-domain, Cialdini, NormBank,
# Social-Chem-101, NormVio, EgoNormia, NormAd, ...). `terms` are Dailymotion-
# validated-style search phrases (video-title / bystander-reaction phrasings,
# with colloquial variants).
#
# state.seed_taxonomy() seeds every term on dailymotion with source="taxonomy"
# and category=<this key>. The category propagates: enumerate_video stamps it on
# seen_videos, and a snowball HIT enqueues its dmrelated child WITH THE SAME
# category -- so every clip (search-found or snowballed) traces to a norm class.
#
# To add/adjust: edit here and restart the main crawl (seeding is idempotent).

categories:

  proxemics_personal_space:
    label: "Proxemics / personal space"
    frameworks: [Hall-proxemics, EgoNormia-Proxemics, BrownLevinson-negative-face]
    terms:
