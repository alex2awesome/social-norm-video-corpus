version: witnessed_search_shadow_v1
active: false
platform: dailymotion
results_per_query: 20

# Frozen retrieval comparison. These are hypotheses, not live queue changes.
# Every retained candidate must pass the full witnessed-v1 video audit; neither
# the query nor the title is evidence that an action or reaction occurred.
groups:
  existing_baseline:
    - public freakout
    - caught littering
    - cutting in line reaction
    - rude customer caught on camera
    - public transport etiquette
    - dog owner confronted poop
  paired_action_reaction_v1:
    - litterer confronted caught on camera
    - line cutter confronted caught on camera
    - racist customer confronted by bystanders
    - rude customer other customers intervene
    - passenger confronted for loud phone on train
    - dog owner confronted for not picking up poop

selection_contract:
  enumeration_only: true
  state_database_mode: read_only
  exclude_already_seen: true
  preserve_all_returned_candidates: true
  title_filter_is_only_for_audit_sampling: true
  title_or_query_can_never_accept: true
  final_gate: full_witnessed_v1_video_review
