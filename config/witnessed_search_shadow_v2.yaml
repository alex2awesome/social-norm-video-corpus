version: witnessed_search_shadow_v2
active: false
platform: dailymotion
results_per_query: 20

# Second read-only canary after v1 returned 0/20 strict witnessed positives.
# Each query binds one pixel-observable action to a human confrontation or
# intervention. Wording is still retrieval-only and cannot support a label.
groups:
  targeted_confrontation_v2:
    - woman dumps trash confronted by passerby
    - shopper abuses cashier customer intervenes
    - passenger harasses woman commuters intervene
    - racist rant bystander steps in
    - line jumper challenged by customer
    - driver attacks cyclist witnesses intervene
    - person steals package homeowner confronts
    - customer threatens worker bystander intervenes

selection_contract:
  enumeration_only: true
  state_database_mode: read_only
  exclude_already_seen: true
  preserve_all_returned_candidates: true
  title_filter_is_only_for_audit_sampling: true
  sample_top_unseen_nonjunk_per_query: 2
  title_or_query_can_never_accept: true
  final_gate: full_witnessed_video_review_and_exact_splice_audit
  production_eligible_without_full_rank_sample_review: false

