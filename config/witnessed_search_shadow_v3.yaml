version: witnessed_search_shadow_v3
active: false
platform: dailymotion
results_per_query: 20

# Third read-only search iteration. V2 found one exact driver/cyclist splice in
# 14 sources. These hypotheses keep the action, affected party, and visible
# confrontation in the query while avoiding generic "freakout" vocabulary.
groups:
  complete_action_then_objection_v3:
    - driver attacks cyclist confronted caught on camera
    - cyclist harassed by driver witnesses intervene
    - litterer confronted full video caught on camera
    - dog owner not picking up poop confronted video
    - line cutter confronted full video
    - customer abuses cashier other customers intervene
    - passenger harasses rider commuters intervene
    - package thief confronted homeowner full video

selection_contract:
  enumeration_only: true
  state_database_mode: read_only
  preserve_all_returned_candidates: true
  title_filter_is_only_for_audit_sampling: true
  title_or_query_can_never_accept: true
  sample_top_unseen_episode_disjoint_nonjunk_per_query: 2
  final_gate: full_witnessed_video_review_and_exact_splice_audit
  action_must_be_visible_before_independent_causal_reaction: true
  reaction_is_private_label_evidence_only: true
  production_eligible_without_full_rank_sample_review: false
