      instructional_route: fresh_exact_demo_review
      evidence: "Five of 16 target-response search sources yielded seven exact instructional demos; none validated a new witnessed target-response rule."
  keep_rules:
    accepted_media: any_medium_if_the_exact_clip_contains_a_resolved_social_demo_and_all_gates_pass
    medium_or_genre_alone_is_never_a_keep_or_reject_rule: true
    require:
      - concrete_social_actor_action_target_or_shared_context
      - visible_temporal_demo_or_visibly_grounded_in_character_speech_act
      - resolved_polarity_in_violation_correct_contrast
      - concrete_normalized_behavior_and_norm
      - no_unremoved_visual_or_audio_answer_leak
      - semantic_domain_match_alone_does_not_count_as_a_demo
    reject:
      - explanation_only_or_talking_head
      - static_card_or_unrelated_broll
      - technical_or_legal_procedure_without_social_expectation
      - generic_safety_medical_animal_or_self_improvement
      - off_topic_or_malformed_non_social_norm
      - in_character_lecture_without_norm_relevant_action
      - visible_activity_that_is_only_a_technical_medical_fitness_or_performance_skill
    explanation_polarity: unresolved_scene_polarity_not_a_positive_label
    deterministic_shadow_contract:
      status: audited_shadow_only
      preserve_raw_outputs_for_audit: true
      require_grounded: [start_quote, end_quote, label_quote]
      require_nonempty: [actor, behavior, target_or_shared_context, norm]
      allowed_polarity: [violation, correct, contrast]
      duration_seconds:
        minimum: 2
        maximum: 30
        reported_visible_action_maximum: 45
      evidence: "On 14/14 manually reviewed v3 outputs, the contract removed four manual rejects and zero accepts; 2/10 survivors were clean, so it is not a sufficient keep gate."
      automatic_accept: false
    transcript_only_detector_is_not_a_keep_gate: true
    transcript_claimed_evidence_kind_is_untrusted_until_visual_verification: true
    final_accept_requires_visual_review_or_a_validated_vlm_judgment: true
    visual_verification_gate:
      require:
        - behavior_is_actually_shown_or_performed_in_a_grounded_social_exchange
        - behavior_is_not_only_described_or_reported
        - one_resolved_occurrence_in_the_exact_interval
        - norm_and_polarity_match_that_same_occurrence
        - temporal_and_cultural_scope_preserved_when_the_rule_is_context_specific
      current_closed_vlm_status: unavailable_no_approved_api_credential
      current_server_vlm_status: no_vision_model_cached_or_serving
      automatic_accept: false
      evidence: "Only 1/11 transcript-shadow-v4 outputs that passed deterministic checks survived complete visual and transcript review; ten were false accepts, chiefly described or reported actions not shown in the pixels."
    ordinary_in_character_subtitles: permitted_unless_they_supply_an_external_answer_label
    instructional_demo_tiers:
      clean_demo:
        require: no_external_answer_label_overlapping_the_exact_demo
        eligible_for: [weak_supervision_training, leakage_sensitive_evaluation_after_all_other_gates]
      labeled_demo:
        require: [concrete_enacted_social_demo, explicit_external_narration_or_answer_label_tracked]
        eligible_for: [weak_supervision_training]
        exclude_from: [leakage_sensitive_evaluation, audio_enabled_label_prediction_benchmarks]
        evidence: "Three manually reviewed TV social-experiment intervals contained distinct enacted harassment/intervention demos but overlapping external narration; retaining a separate tier preserves valid demos without calling them leakage-clean."
      context_prompt_is_not_automatically_an_answer_label:
        require: prompt_sets_up_roles_or_request_without_stating_the_correctness_or_violation_judgment
        evidence: "The reviewed blindfolded-Muslim trust prompt was followed by a complete hug interaction; later prescriptive advocacy cards were excluded."
    demos_per_video:
      fixed_cap: null
      require_each_demo_to_be_a_distinct_enacted_occurrence_with_separate_exact_bounds: true
      evidence: "One TV source contained three semantically distinct, fully reviewed harassment/intervention scenarios; a fixed one-demo cap would discard valid supervision."
    exact_occurrence_localization:
      require_one_resolved_occurrence_per_clip: true
      multievent_or_multistory_span: reject_until_each_occurrence_is_separately_recut_and_reaudited
      evidence: "The 11:19 cohort contained a 121-second children-story span joining several prank, property, and balloon events under one sharing label; it failed despite containing relevant action."
    norm_and_polarity_match:
      require_demonstrated_act_to_support_both_the_normalized_norm_and_polarity: true
      reverse_polarity_or_underspecified_norm: reject_or_render_relabel_candidate_then_reaudit
      evidence: "Two of five social-demo clips in the 11:19 cohort failed because an environmental satire was labeled correct/caring and a justified reduced tip was labeled as a small-tip violation."
    temporal_and_cultural_scope:
      context_specific_norms_must_not_be_emitted_as_current_universal_rules: true
      missing_scope: reject_or_render_relabel_candidate_then_reaudit
      evidence: "Two clear demonstrations in a 1970 US Army etiquette film taught gendered introduction and ordering conventions; both failed as unscoped present-day universal labels."
    narrated_institutional_broll:
      accepted_only_as: labeled_demo
      require: concrete_visible_implementation_of_the_norm
      evidence: "A hospital worker showing a kosher menu concretely demonstrated religious dietary accommodation, but overlapping narration limits it to training-only weak supervision."
    repairs:
      tighten_to_demo:
        status: supported_candidate_only
        automatic_accept: false
        evidence: "10/18 ledgered exact temporal repairs passed; 8/18 failed, including target-off-camera, prior-action, leakage, and unrelated-boundary cases"
      crop_label_overlay:
        status: supported_candidate_only
        automatic_accept: false
        evidence: "1/4 direct rendered spatial crops passed; the sole pass required an arbitrary right-panel crop plus audio removal and full exact-artifact review, while three simpler crops failed"
      strip_explanatory_audio:
        status: chainable_candidate_only
        evidence: "1/2 ledgered audio-removal artifacts passed; the passing artifact followed an exact visual recut, while the failed direct repair retained a visual answer card"
      exact_repaired_artifact:
        require: [persisted_mp4, mp4_sha256, repaired_frame_manifest_sha256, verified_duration, verified_audio_stream_count, recursive_transform_provenance, recursive_label_transcript_provenance, full_postrepair_audit]
      relabel_norm_or_polarity:
        status: requires_explicit_reviewed_normalization

